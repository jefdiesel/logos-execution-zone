[book]
title = "LEZ Program Development: the Actor Model"
description = "A developer manual for writing programs on the Logos Execution Zone with transactional actors: handlers and messages, the privacy model and its limits, a pattern language for public/private interplay, and a catalog of program designs."
authors = ["Logos Execution Zone contributors"]
language = "en"
src = "src"

[build]
create-missing = false

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/logos-blockchain/logos-execution-zone"
fold = { enable = true, level = 1 }

[output.html.search]
limit-results = 30
